name: deploy

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

env:
  GHLOG_VERSION: v0.1.0-alpha.1

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Install ghlog
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: dhth/ghlog
          tag: ${{ env.GHLOG_VERSION }}
      - name: Run ghlog
        env:
          GHLOG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ghlog run dhth \
            --limit 300 \
            --format html \
            > /tmp/activity.html
      - uses: actions/checkout@v6
      - name: Check if results should be published
        id: check-publish
        run: |
          echo "publish=$(./.github/scripts/should-publish-results.sh /tmp/activity.html)" >> "$GITHUB_OUTPUT"
      - name: Prepare Pages artifact
        if: steps.check-publish.outputs.publish == '1'
        run: |
          mkdir -p dist
          cp /tmp/activity.html dist/index.html
      - name: Setup Pages
        if: steps.check-publish.outputs.publish == '1'
        uses: actions/configure-pages@v6
      - name: Upload artifact
        if: steps.check-publish.outputs.publish == '1'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "dist"
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.check-publish.outputs.publish == '1'
        uses: actions/deploy-pages@v5
